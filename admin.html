<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ASGT Admin — Secure</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="loginScreen" class="auth-wrap">
    <section class="auth-card">
      <div class="brand">ASGT <span>Store Admin</span></div>
      <h1>Admin Login</h1>
      <p>Sign in with your authorized admin account.</p>
      <form id="loginForm">
        <label>Email<input id="loginEmail" type="email" autocomplete="username" required></label>
        <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
        <button class="btn full" type="submit">Sign In</button>
        <div id="loginStatus" class="status"></div>
      </form>
    </section>
  </div>

  <div id="app" hidden>
    <header>
      <div>
        <div class="brand">ASGT <span>Store Admin</span></div>
        <p>Manage your iPhone listings</p>
      </div>
      <div class="header-actions">
        <a href="/" class="back">View Store</a>
        <button id="logoutBtn" class="logout">Log Out</button>
      </div>
    </header>

    <main>
      <section class="card">
        <div class="form-head">
          <div>
            <h1 id="formTitle">Add iPhone</h1>
            <p id="formHint">Publish a new listing to the store.</p>
          </div>
        </div>
        <form id="phoneForm" enctype="multipart/form-data">
          <input type="hidden" name="id" id="phoneId">
          <div class="grid">
            <label>Phone Name<input name="name" placeholder="iPhone 15 Pro Max" required></label>
            <label>Price (₱)<input name="price" type="number" min="0" placeholder="44990" required></label>
            <label>Storage<input name="storage" placeholder="256GB"></label>
            <label>Color<input name="color" placeholder="Natural Titanium"></label>
            <label>Condition<input name="condition" placeholder="Excellent / Brand New"></label>
            <label>Battery Health<input name="battery" placeholder="95%"></label>
            <label class="wide">Description<textarea name="description" placeholder="Complete details, inclusions, issues, warranty, etc."></textarea></label>
            <label class="wide">Phone Images
              <input name="images" type="file" accept="image/*" multiple>
              <small id="imageHelp">Select one or more photos. New listings require at least one image. When editing, leave empty to keep the current photos.</small>
            </label>
          </div>
          <button id="submitBtn" class="btn" type="submit">Upload &amp; Publish</button>
          <button id="cancelEditBtn" class="secondary" type="button" hidden>Cancel Edit</button>
          <span id="status" class="status"></span>
        </form>
      </section>

      <section class="card">
        <div class="list-head">
          <div>
            <h2>Current Listings</h2>
            <p class="muted">Changes are saved directly to Supabase.</p>
          </div>
          <div class="list-actions">
            <button id="refreshBtn" class="secondary">Refresh</button>
            <button id="deleteAllBtn" class="danger">Delete All</button>
          </div>
        </div>
        <div id="list"><p class="muted">Loading...</p></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js?v=20260905-secure-final"></script>
</body>
</html>
